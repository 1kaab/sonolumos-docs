name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout quartz
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout sonolumos docs
        uses: actions/checkout@v7
        with:
          repository: 1kaab/sonolumos
          path: _sonolumos
          sparse-checkout: docs/obsidian

      - name: Copy docs into Quartz content
        run: cp -r _sonolumos/docs/obsidian/. content/

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Quartz
        run: npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
